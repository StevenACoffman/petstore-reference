openapi: 3.1.0
info:
  title: pet.v2
  description: API documentation for pet.v2
  version: 1.0.0
servers:
  - url: https://localhost:8080
    description: Local API Server (TLS)
  - url: http://localhost:8080
    description: Local API Server (Cleartext)
paths:
  /pet.v2.PetService/CreatePet:
    post:
      tags:
        - pet.v2.PetService
      summary: CreatePet
      operationId: pet.v2.PetService.CreatePet
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pet.v2.CreatePetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pet.v2.CreatePetResponse'
  /pet.v2.PetService/DeletePet:
    post:
      tags:
        - pet.v2.PetService
      summary: DeletePet
      operationId: pet.v2.PetService.DeletePet
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pet.v2.DeletePetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pet.v2.DeletePetResponse'
  /pet.v2.PetService/GetPet:
    post:
      tags:
        - pet.v2.PetService
      summary: GetPet
      operationId: pet.v2.PetService.GetPet
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pet.v2.GetPetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pet.v2.GetPetResponse'
  /pet.v2.PetService/ListPets:
    post:
      tags:
        - pet.v2.PetService
      summary: ListPets
      operationId: pet.v2.PetService.ListPets
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pet.v2.ListPetsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pet.v2.ListPetsResponse'
  /pet.v2.PetService/UpdatePet:
    post:
      tags:
        - pet.v2.PetService
      summary: UpdatePet
      operationId: pet.v2.PetService.UpdatePet
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pet.v2.UpdatePetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pet.v2.UpdatePetResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    pet.v2.CreatePetRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
        species:
          type: string
          title: species
          maxLength: 50
          minLength: 1
        birthDate:
          type: string
          title: birth_date
          pattern: ^(\d{4}-\d{2}-\d{2})?$
        status:
          allOf:
            - $ref: '#/components/schemas/pet.v2.PetStatus'
          title: status
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          title: photo_urls
        tags:
          type: array
          items:
            type: string
          title: tags
        birthDateEstimated:
          type: boolean
          title: birth_date_estimated
      title: CreatePetRequest
      additionalProperties: false
    pet.v2.CreatePetResponse:
      type: object
      properties:
        pet:
          allOf:
            - $ref: '#/components/schemas/pet.v2.Pet'
          title: pet
      title: CreatePetResponse
      additionalProperties: false
    pet.v2.DeletePetRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: DeletePetRequest
      additionalProperties: false
    pet.v2.DeletePetResponse:
      type: object
      properties:
        success:
          type: boolean
          title: success
      title: DeletePetResponse
      additionalProperties: false
    pet.v2.GetPetRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
      title: GetPetRequest
      additionalProperties: false
    pet.v2.GetPetResponse:
      type: object
      properties:
        pet:
          allOf:
            - $ref: '#/components/schemas/pet.v2.Pet'
          title: pet
      title: GetPetResponse
      additionalProperties: false
    pet.v2.ListPetsRequest:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/pet.v2.PetStatus'
          title: status
          description: Filter by status (optional)
        species:
          type: string
          title: species
          description: Filter by species (optional)
        pageSize:
          type: integer
          title: page_size
          maximum: 100
          minimum: 0
          format: int32
          description: Maximum number of pets to return
        page:
          type: integer
          title: page
          minimum: 0
          format: int32
          description: |-
            Deprecated: offset paging skipped rows inserted between fetches and served
             others twice. Sending a non-zero value is rejected; use page_token.
          deprecated: true
        pageToken:
          type: string
          title: page_token
          description: |-
            Opaque token from a previous response's next_page_token. Empty starts at the
             first page.
      title: ListPetsRequest
      additionalProperties: false
    pet.v2.ListPetsResponse:
      type: object
      properties:
        pets:
          type: array
          items:
            $ref: '#/components/schemas/pet.v2.Pet'
          title: pets
        totalCount:
          type: integer
          title: total_count
          format: int32
          description: Pets matching the filters, ignoring the page token.
        nextPageToken:
          type: string
          title: next_page_token
          description: Token for the next page; empty when this is the last one.
      title: ListPetsResponse
      additionalProperties: false
    pet.v2.Pet:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
        species:
          type: string
          title: species
          maxLength: 50
          minLength: 1
        birthDate:
          type: string
          title: birth_date
          pattern: ^(\d{4}-\d{2}-\d{2})?$
        status:
          allOf:
            - $ref: '#/components/schemas/pet.v2.PetStatus'
          title: status
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          title: photo_urls
        tags:
          type: array
          items:
            type: string
          title: tags
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        modifiedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: modified_at
        createdBy:
          type: string
          title: created_by
        modifiedBy:
          type: string
          title: modified_by
        birthDateEstimated:
          type: boolean
          title: birth_date_estimated
      title: Pet
      additionalProperties: false
    pet.v2.PetStatus:
      type: string
      title: PetStatus
      enum:
        - PET_STATUS_UNSPECIFIED
        - PET_STATUS_AVAILABLE
        - PET_STATUS_PENDING
        - PET_STATUS_ADOPTED
    pet.v2.UpdatePetRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
        name:
          type:
            - string
            - "null"
          title: name
          maxLength: 100
          minLength: 1
        species:
          type:
            - string
            - "null"
          title: species
          maxLength: 50
          minLength: 1
        birthDate:
          type:
            - string
            - "null"
          title: birth_date
          pattern: ^(\d{4}-\d{2}-\d{2})?$
        status:
          oneOf:
            - $ref: '#/components/schemas/pet.v2.PetStatus'
            - type: "null"
          title: status
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          title: photo_urls
        tags:
          type: array
          items:
            type: string
          title: tags
        birthDateEstimated:
          type:
            - boolean
            - "null"
          title: birth_date_estimated
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: Paths to write, e.g. "name", "tags". Absent means full replacement.
      title: UpdatePetRequest
      additionalProperties: false
      description: |-
        UpdatePetRequest changes an existing pet.

         Partial updates are expressed with update_mask, following AIP-134:

           - update_mask present: only the named paths are written. Every other field is
             left exactly as stored, whatever the request carries for it.
           - update_mask absent: full replacement, for backwards compatibility with
             clients that load a pet, edit it, and send the whole thing back.

         One deviation from strict full replacement, in both modes: a status of
         PET_STATUS_UNSPECIFIED means "leave the status alone", never "reset to
         available". A zero enum value is indistinguishable from an unsent one on the
         wire, and silently moving an adopted pet back to available is never what a
         caller meant.

         The scalar fields are `optional` so a partial request can omit them without
         tripping the length and pattern rules below; those rules apply only to fields
         the caller actually sends.
    pet.v2.UpdatePetResponse:
      type: object
      properties:
        pet:
          allOf:
            - $ref: '#/components/schemas/pet.v2.Pet'
          title: pet
      title: UpdatePetResponse
      additionalProperties: false
security: []
tags:
  - name: pet.v2.PetService
