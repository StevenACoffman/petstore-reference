# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# This project releases a container image, not binaries. One config serves two
# jobs, told apart by IMAGE_ONLY:
#
#   tag push  (.github/workflows/release.yml) — the image tagged with the
#             version, plus a signed source tarball and a GitHub release.
#   main push (.github/workflows/publish-image.yml) — the image alone. It sets
#             IMAGE_ONLY=true, which disables the GitHub release.
#
# Local test:
#   goreleaser release --snapshot --clean --skip=sign
# --snapshot implies --skip=publish, so that builds the image without pushing.
version: 2
project_name: petstore-reference
before:
  hooks:
  - go mod tidy
# No binaries are distributed, but ko resolves its `build:` against this list,
# so the entry has to exist. skip keeps goreleaser from compiling and archiving
# a binary that nothing consumes; ko does its own build.
builds:
- id: server
  main: ./cmd/server
  skip: true
# ko builds the image from Go source — no Dockerfile, no docker daemon, and a
# reproducible layout. The module path is github.com/example/pets while the
# repository is not, so `bare` is required: without it ko appends the import
# path to the repository and the image lands somewhere nobody expects.
kos:
- id: server
  build: server
  main: ./cmd/server
  base_image: cgr.dev/chainguard/static
  repositories:
  - ghcr.io/{{ tolower (envOrDefault "GITHUB_REPOSITORY" "stevenacoffman/petstore-reference") }}
  bare: true
  platforms:
  - linux/amd64
  - linux/arm64
  env: [CGO_ENABLED=0]
  ldflags: [-s -w]
  # Pin both timestamps to the commit so rebuilding one commit gives an
  # identical digest instead of one that changes with the clock.
  creation_time: "{{ .CommitTimestamp }}"
  ko_data_creation_time: "{{ .CommitTimestamp }}"
  # SPDX SBOM per manifest, pushed beside the image. ko's default, written
  # out so that disabling it has to be deliberate.
  sbom: spdx
  tags:
  # A release tags the version plus latest; a main push sets IMAGE_TAG=main
  # and IMAGE_ONLY=true, which drops latest — an empty tag is discarded.
  #
  # Keyed off IMAGE_ONLY, not .IsSnapshot: a main push publishes, so it is
  # not a snapshot, and .IsSnapshot would tag every main commit with the
  # last release's version and latest, overwriting the released image.
  - '{{ envOrDefault "IMAGE_TAG" .Version }}'
  - '{{ if eq (envOrDefault "IMAGE_ONLY" "false") "true" }}{{ else }}latest{{ end }}'
  # Immutable: the tag to pin a deployment to.
  - "{{ .FullCommit }}"
  labels:
    org.opencontainers.image.source: "https://github.com/{{ envOrDefault \"GITHUB_REPOSITORY\" \"StevenACoffman/petstore-reference\" }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.version: "{{ .Version }}"
    org.opencontainers.image.licenses: MIT
# The source tarball is the only file artifact: it makes a release auditable
# without shipping binaries. The image carries its own SBOM, generated by ko.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
sboms:
- id: source
  artifacts: source
checksum:
  name_template: "checksums.txt"
# Keyless cosign over the checksum, which covers the source tarball and its
# SBOM, so one signature makes both verifiable.
signs:
- cmd: cosign
  signature: "${artifact}.sigstore.json"
  args:
  - sign-blob
  - "--bundle=${signature}"
  - "${artifact}"
  - "--yes"
  artifacts: checksum
  output: true
changelog:
  sort: asc
  filters:
    exclude:
    - "^docs:"
    - "^test:"
release:
  # A main-branch image push must not create a GitHub release.
  disable: '{{ envOrDefault "IMAGE_ONLY" "false" }}'
  footer: |
    ## Container image

    ```bash
    docker pull ghcr.io/{{ tolower .Env.GITHUB_REPOSITORY }}:{{ .Version }}
    cosign verify ghcr.io/{{ tolower .Env.GITHUB_REPOSITORY }}:{{ .Version }} \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity-regexp 'https://github.com/{{ .Env.GITHUB_REPOSITORY }}/.*'
    ```

    ## Verifying the source tarball

    ```bash
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity 'https://github.com/{{ .Env.GITHUB_REPOSITORY }}/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      checksums.txt

    shasum -a 256 --ignore-missing -c checksums.txt
    ```

    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
