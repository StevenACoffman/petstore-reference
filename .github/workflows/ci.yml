name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; only the newest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: golangci-lint (default build)
        run: golangci-lint run --timeout=5m ./...
      - name: golangci-lint (integration build)
        run: golangci-lint run --timeout=5m --build-tags=integration ./...

  tidy:
    name: go mod tidy is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: |
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

  generate:
    name: Generated code is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Regenerate protobuf, Connect, OpenAPI and sqlc output
        run: just generate
      - name: Fail if regeneration produced a diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale. Run 'just generate' and commit the result."
            exit 1
          fi

  buf:
    name: Protobuf lint and breaking-change check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: buf lint
      - name: Breaking-change check against the base branch
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Run the fast suite with the race detector
        run: go test -race -count=1 ./...
      - name: Coverage report
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      # Testcontainers talks to the runner's own Docker daemon, which is already
      # present on ubuntu-latest. No service container is declared here because the
      # suites provision and tear down their own Postgres.
      - name: Run the container-backed suites
        run: go test -race -tags=integration -count=1 ./...

  fuzz:
    name: Fuzz the pure core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      # A short burst per target on every PR. This is a smoke test, not a campaign:
      # it catches a newly introduced crasher quickly. Any input that fails is written
      # to testdata/fuzz and uploaded so it can be committed as a regression seed.
      - name: Fuzz each target briefly
        run: just fuzz-all 20s
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failures
          path: internal/pet/testdata/fuzz/
          retention-days: 30

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: govulncheck ./...

  web:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # The suite spawns its own FauxRPC mock server against the committed descriptor
      # image, so it needs the fauxrpc binary that mise installs but no live backend.
      - run: pnpm test
        working-directory: web
