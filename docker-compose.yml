services:
  postgres:
    image: postgres:17-alpine
    container_name: pets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pets_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Continuous profiling sink. `just up` starts it so PYROSCOPE_ENDPOINT has
  # somewhere to push to; the UI is at http://localhost:4040.
  pyroscope:
    image: grafana/pyroscope:1.16.0
    container_name: pets-pyroscope
    restart: unless-stopped
    ports:
      - "4040:4040"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4040/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
